<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The Content-Security-Policy lives in src-tauri/tauri.conf.json, which Tauri
         injects into the packaged page. A meta tag here would have to name the IPC
         origins itself, which differ per platform. -->
    <title>Desktop Cat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The window spans the whole work area; the cat moves inside it with a
         transform so walking never costs an IPC round trip per frame. -->
    <div id="stage">
      <div id="hearts" aria-hidden="true"></div>
      <!-- Food on the floor. Shown only while the brain has an offer, and placed
           from JS, so the cat and its dinner can never disagree about where it is. -->
      <img id="treat" src="../icons/fish.png" alt="" aria-hidden="true" hidden />
      <canvas id="cat" width="160" height="160"></canvas>
    </div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
