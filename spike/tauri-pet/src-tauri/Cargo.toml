[package]
name = "tauri-pet"
version = "0.1.0"
description = "Spike: can Tauri 2 host the desktop cat's window behaviour?"
authors = ["desktop-cat"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon for the menu-bar presence; image-png so the tray can take the
# scaffolded PNG icon. The opener plugin the template ships is not needed here.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the self-test: driving the real cursor with SetCursorPos and reading
# the window's extended styles, which is how the spike proves click-through is
# actually on or off rather than taking the renderer's word for it. Pinned to the
# same major as the one tauri-runtime-wry uses so `WebviewWindow::hwnd()`'s HWND
# is the same type.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
